<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpacePlan</title><link rel="stylesheet" href="styles.css"><header><h1>SpacePlan</h1><p>Architectural layout planner · Concept design</p></header><main><aside><h2>Room dimensions (m)</h2><label>Width <input id="w" type="number" min="2" max="30" step="0.1" value="6"></label><label>Depth <input id="h" type="number" min="2" max="30" step="0.1" value="5"></label><button id="resize">Apply dimensions</button><h2>Furniture</h2><select id="kind"><option>Sofa</option><option>Table</option><option>Chair</option><option>Bed</option><option>Cabinet</option></select><button id="add">Add furniture</button><button id="rotate">Rotate selected 90°</button><button id="remove">Delete selected</button><h2>Layout files</h2><button id="save">Export JSON</button><label>Import JSON<input id="load" type="file" accept=".json"></label><p id="stats" aria-live="polite"></p><p id="status" aria-live="polite"></p></aside><section><svg id="plan" viewBox="0 0 800 600" aria-label="Interactive floor plan"></svg><p>Drag furniture to reposition it. Select an item to rotate or delete it. Grid spacing: 0.5 m.</p></section></main><script src="app.js"></script></html>
